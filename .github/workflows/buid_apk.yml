name: Build Signed AvangVPN APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Release APK
        run: gradle assembleRelease --no-daemon

      - name: Generate Keystore & Sign APK
        run: |
          keytool -genkeypair -v \
            -keystore avang_release.jks \
            -alias avang_key \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass Avang@2026 \
            -keypass Avang@2026 \
            -dname "CN=JRweb, OU=Mobile, O=JRweb, L=Tehran, S=Tehran, C=IR"

          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          $BUILD_TOOLS_DIR/zipalign -v -p 4 \
            app/build/outputs/apk/release/app-release-unsigned.apk \
            app-release-aligned.apk

          $BUILD_TOOLS_DIR/apksigner sign \
            --ks avang_release.jks \
            --ks-key-alias avang_key \
            --ks-pass pass:Avang@2026 \
            --key-pass pass:Avang@2026 \
            --out AvangVPN-Release-Signed.apk \
            app-release-aligned.apk

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: AvangVPN-Signed-APK
          path: AvangVPN-Release-Signed.apk
